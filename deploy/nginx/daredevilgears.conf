# Production Nginx for a single VPS (PM2 processes on localhost).
#   storefront  https://www.daredevilgears.com  -> 127.0.0.1:3000, /api -> 127.0.0.1:4000
#   admin       https://admin.daredevilgears.com -> 127.0.0.1:3001, /api/v1/admin -> 127.0.0.1:4000
# Each host proxies its own /api so cookies stay first-party and host-only (COOKIE_DOMAIN empty).
# TLS: certbot --nginx -d daredevilgears.com -d www.daredevilgears.com -d admin.daredevilgears.com
# Install: copy to /etc/nginx/sites-available/, symlink to sites-enabled, copy ddg-proxy-prod.inc to /etc/nginx/snippets/.

limit_req_zone $binary_remote_addr zone=ddg_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=ddg_auth:10m rate=5r/m;
limit_req_status 429;
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

upstream ddg_api { server 127.0.0.1:4000; keepalive 16; }
upstream ddg_store { server 127.0.0.1:3000; keepalive 16; }
upstream ddg_admin { server 127.0.0.1:3001; keepalive 8; }

# HTTP -> HTTPS, apex -> www
server {
  listen 80;
  listen [::]:80;
  server_name daredevilgears.com www.daredevilgears.com admin.daredevilgears.com;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}
server {
  # `listen ... http2` works on Ubuntu's nginx 1.24; on nginx >= 1.25.1 you may switch to `http2 on;`
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name daredevilgears.com;
  ssl_certificate /etc/letsencrypt/live/daredevilgears.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/daredevilgears.com/privkey.pem;
  return 301 https://www.daredevilgears.com$request_uri;
}

# ---------------- storefront ----------------
server {
  # `listen ... http2` works on Ubuntu's nginx 1.24; on nginx >= 1.25.1 you may switch to `http2 on;`
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name www.daredevilgears.com;
  ssl_certificate /etc/letsencrypt/live/daredevilgears.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/daredevilgears.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:ddg_ssl:10m;
  client_max_body_size 12m;
  server_tokens off;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Razorpay webhook: raw body, no rate limit (signature verified by the API)
  location = /api/v1/webhooks/razorpay { proxy_pass http://ddg_api; include snippets/ddg-proxy-prod.inc; }
  location ~ ^/api/v1/auth/(login|register|verify-email|resend-otp|forgot-password|reset-password) {
    limit_req zone=ddg_auth burst=10 nodelay;
    proxy_pass http://ddg_api;
    include snippets/ddg-proxy-prod.inc;
  }
  # uptime probe (database connectivity)
  location = /api/ready { proxy_pass http://ddg_api/ready; include snippets/ddg-proxy-prod.inc; }
  location /api/v1/admin/ { return 404; }
  location /api/docs { return 404; }
  location /api/ { limit_req zone=ddg_api burst=40 nodelay; proxy_pass http://ddg_api; include snippets/ddg-proxy-prod.inc; }
  location /_next/static/ { proxy_pass http://ddg_store; add_header Cache-Control "public, max-age=31536000, immutable"; }
  location / { proxy_pass http://ddg_store; include snippets/ddg-proxy-prod.inc; }
}

# ---------------- admin ----------------
server {
  # `listen ... http2` works on Ubuntu's nginx 1.24; on nginx >= 1.25.1 you may switch to `http2 on;`
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name admin.daredevilgears.com;
  ssl_certificate /etc/letsencrypt/live/daredevilgears.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/daredevilgears.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  client_max_body_size 12m;
  server_tokens off;
  add_header X-Robots-Tag "noindex, nofollow" always;

  # Optional hardening: allow only office / VPN addresses
  # allow 203.0.113.10; deny all;

  location /api/v1/admin/auth/login { limit_req zone=ddg_auth burst=5 nodelay; proxy_pass http://ddg_api; include snippets/ddg-proxy-prod.inc; }
  location /api/v1/admin/ { limit_req zone=ddg_api burst=40 nodelay; proxy_pass http://ddg_api; include snippets/ddg-proxy-prod.inc; }
  location /api/ { return 404; }
  location / { proxy_pass http://ddg_admin; include snippets/ddg-proxy-prod.inc; }
}
