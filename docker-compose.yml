# DareDevil Gears — full stack on one host.
#   cp backend/.env.example .env.docker   # fill in secrets (see docs/DEPLOYMENT.md)
#   docker compose --env-file .env.docker up -d --build
#   docker compose --env-file .env.docker exec backend npm run seed:all
# Only Nginx publishes ports. MongoDB and Redis stay on the internal network.
name: daredevil-gears

x-backend-env: &backend-env
  NODE_ENV: production
  PORT: 4000
  MONGODB_URI: mongodb://mongo:27017/daredevil_gears?replicaSet=rs0
  REDIS_URL: redis://redis:6379
  TRUST_PROXY: 1
  STOREFRONT_URL: ${STOREFRONT_URL:?set STOREFRONT_URL}
  STOREFRONT_INTERNAL_URL: http://frontend:3000
  REVALIDATE_SECRET: ${REVALIDATE_SECRET:-}
  ADMIN_URL: ${ADMIN_URL:?set ADMIN_URL}
  API_PUBLIC_URL: ${API_PUBLIC_URL:-}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?}
  ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:?}
  OTP_PEPPER: ${OTP_PEPPER:?}
  ADMIN_MFA_REQUIRED: "true"
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:-DareDevil Gears}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-}
  MAIL_DEV_OUTBOX: "false"
  RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
  RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
  RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
  CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
  CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
  CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
  SHIPROCKET_EMAIL: ${SHIPROCKET_EMAIL:-}
  SHIPROCKET_PASSWORD: ${SHIPROCKET_PASSWORD:-}
  SENTRY_DSN: ${SENTRY_DSN:-}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-}
  SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-}
  SUPER_ADMIN_NAME: ${SUPER_ADMIN_NAME:-}

services:
  mongo:
    image: mongo:7.0
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes: [mongo-data:/data/db]
    restart: unless-stopped
    healthcheck:
      # initialise the single-node replica set on first boot (needed for transactions)
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }).ok }"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: [redis-data:/data]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s

  backend:
    build: ./backend
    image: ddg-backend
    environment:
      <<: *backend-env
      RUN_SCHEDULER: "false" # the worker container runs the schedule
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  worker:
    image: ddg-backend
    command: ["node", "src/jobs/worker.js"]
    environment: *backend-env
    depends_on: [backend]
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args: { API_INTERNAL_URL: "http://backend:4000", NEXT_PUBLIC_SITE_URL: "${STOREFRONT_URL}" }
    image: ddg-frontend
    environment:
      API_INTERNAL_URL: http://backend:4000
      SITE_URL: ${STOREFRONT_URL}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-}
    depends_on: [backend]
    restart: unless-stopped

  admin:
    build:
      context: ./admin
      args: { API_INTERNAL_URL: "http://backend:4000", NEXT_PUBLIC_STOREFRONT_URL: "${STOREFRONT_URL}" }
    image: ddg-admin
    environment:
      API_INTERNAL_URL: http://backend:4000
    depends_on: [backend]
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports: ["80:80"]
    volumes:
      - ./deploy/nginx/docker.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./deploy/nginx/ddg-proxy.inc:/etc/nginx/conf.d/ddg-proxy.inc:ro
    environment:
      STORE_HOST: ${STORE_HOST:-localhost}
      ADMIN_HOST: ${ADMIN_HOST:-admin.localhost}
    depends_on: [frontend, admin, backend]
    restart: unless-stopped

volumes:
  mongo-data:
  redis-data:
